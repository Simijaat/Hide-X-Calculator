name: Android CI

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Lint and Check
      run: ./gradlew lint check
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Verify APK and Metadata
      run: |
        ls -la app/build/outputs/apk/debug/
        test -f "app/build/outputs/apk/debug/app-debug.apk"
        $ANDROID_HOME/build-tools/33.0.1/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep package
        $ANDROID_HOME/build-tools/33.0.1/apksigner verify app/build/outputs/apk/debug/app-debug.apk
    - name: Upload Debug Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
